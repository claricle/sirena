# Cache results between runs
cache = true

# Maximum number of concurrent link checks
max_concurrency = 16

# Accept status codes. GitHub answers bursts of blob/main links with 429 or
# 503 for files that exist. lychee 0.15.0 does not retry HTTP status errors
# (max_retries below retries only transport failures), so accepting 503 is the
# only lever, and accept is global rather than per-host. 404 and 500 still fail.
accept = [200, 204, 301, 302, 307, 308, 403, 429, 503]

# Exclude patterns
exclude = [
    # Skip local file URLs that won't exist in production
    '^file://',
    # Skip mailto links
    '^mailto:',
    # Skip anchors without base URL
    '^#',
]

# Jekyll generates canonical/sitemap URLs from site.url, pointing back at
# this site's own production domains. A page this run just built (e.g. a
# brand-new diagram type) always 404s there pre-deploy. links.yml remaps
# those self-references to the local build (using the runner's actual
# workspace path, not hardcoded here) and adds matching --include entries
# for the resulting file:// URLs, since lychee applies remap before
# filtering and this file's blanket file:// exclude would otherwise drop
# them silently instead of checking them.

# Include patterns
include = [
    # Check all HTTP/HTTPS links
    '^https?://',
]

# Timeout for each request (in seconds)
timeout = 30

# Number of retries
max_retries = 3

# User agent
user_agent = "lychee/link-checker"

# Exclude certain file types from link checking
exclude_file = []

# Skip checking links in certain HTML elements
exclude_mail = true

# Check for broken fragments (anchors)
check_anchors = true

# Verify SSL certificates
require_https = false

# Follow redirects
follow_redirects = true

# Maximum redirect depth
max_redirects = 10

# Verbosity
verbose = "info"