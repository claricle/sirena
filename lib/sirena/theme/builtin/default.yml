name: default
description: "Sirena default theme with clean, professional styling"

colors:
  background: "#ffffff"
  surface: "#f5f5f5"
  surface_variant: "#e0e0e0"

  foreground: "#000000"
  foreground_secondary: "#666666"

  primary: "#007bff"
  secondary: "#6c757d"
  accent: "#28a745"
  error: "#dc3545"
  warning: "#ffc107"
  success: "#28a745"
  info: "#17a2b8"

  node_fill: "#ffffff"
  node_stroke: "#000000"
  edge_stroke: "#000000"
  label_text: "#000000"

  hover_fill: "#f0f0f0"
  active_fill: "#e0e0e0"
  disabled_fill: "#cccccc"

  # Colours renderers drew from a hardcoded fallback; same in every theme.
  border: "#d1d5db"
  edge_color: "#666"
  field_background: "#efefef"
  field_border: "#000000"
  field_text: "#000000"
  group_background: "#f0f0f0"
  highlight: "#fbbf24"
  node_bg: "#E3F2FD"
  node_text: "#FFFFFF"
  note_fill: "#fefecd"
  section_bg: "#f0f0f0"
  title_text: "#000000"
  card_text: "#1f2937"
  xy_axis_line: "#000000"
  xy_grid_line: "#e5e7eb"

  # Categorical palettes: same in every theme, indexed modulo length.
