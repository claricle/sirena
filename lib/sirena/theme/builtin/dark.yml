name: dark
description: "Dark theme optimized for low-light environments"

colors:
  background: "#1e1e1e"
  surface: "#2d2d30"
  surface_variant: "#3e3e42"

  foreground: "#d4d4d4"
  foreground_secondary: "#969696"

  primary: "#3794ff"
  secondary: "#858585"
  accent: "#4ec9b0"
  error: "#f48771"
  warning: "#dcdcaa"
  success: "#89d185"
  info: "#9cdcfe"

  node_fill: "#2d2d30"
  node_stroke: "#858585"
  edge_stroke: "#858585"
  label_text: "#d4d4d4"

  hover_fill: "#3e3e42"
  active_fill: "#505050"
  disabled_fill: "#404040"

  # Colours renderers drew from a hardcoded fallback; same in every theme.
  border: "#d1d5db"
  edge_color: "#666"
  field_background: "#efefef"
  field_border: "#000000"
  field_text: "#000000"
  group_background: "#f0f0f0"
