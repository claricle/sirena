name: high_contrast
description: "High contrast theme for accessibility"

colors:
  background: "#000000"
  surface: "#000000"
  surface_variant: "#1a1a1a"

  foreground: "#ffffff"
  foreground_secondary: "#ffffff"

  primary: "#ffff00"
  secondary: "#00ffff"
  accent: "#00ff00"
