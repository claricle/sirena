  node_fill: "#000000"
  node_stroke: "#ffffff"
  edge_stroke: "#ffffff"
  label_text: "#ffffff"

  hover_fill: "#1a1a1a"
  active_fill: "#333333"
  disabled_fill: "#666666"

  # Colours renderers drew from a hardcoded fallback; same in every theme.
  border: "#d1d5db"
  edge_color: "#666"
