name: build_deploy

on:
  # Pull-request, merge-group and nightly runs come in through ci.yml's
  # full lane (workflow_call); this file's own triggers are the deploy paths.
  push:
    branches: [main]
  repository_dispatch:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_deploy:
        description: Build and verify only; never deploy.
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Ruby (repo root, for example assets)
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073  # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073  # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0
          working-directory: docs

      - name: Generate example SVGs into docs/assets
        run: bundle exec rake examples:copy_to_docs

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --verbose --trace --baseurl "${{ steps.pages.outputs.base_path }}"
        working-directory: docs
        env:
          JEKYLL_ENV: production

      # Run under the DOCS bundle, not bare `ruby`. The verifier parses the
      # built HTML with nokogiri now, and the setup-ruby step above installs
      # docs/Gemfile only -- bare `ruby` here would die with LoadError. Both
      # invocations were checked to give identical output on a built site.
      - name: Verify docs site output
        run: >-
          bundle exec ruby ../scripts/verify_docs_site.rb
          --docs-dir .
          --baseurl "${{ steps.pages.outputs.base_path }}"
        working-directory: docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: docs/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: ${{ github.ref == 'refs/heads/main' && !inputs.skip_deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
