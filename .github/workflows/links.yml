name: links

on:
  # Pull-request, merge-group and nightly runs come in through ci.yml's
  # full lane (workflow_call).
  workflow_call:
  workflow_dispatch:
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  link_checker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073  # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073  # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs

      - name: Generate example SVGs into docs/assets
        run: bundle exec rake examples:copy_to_docs

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace
        working-directory: docs

      - name: Restore lychee cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          # No restore-keys: lychee 0.15.0 checks its cache before remapping
          # and caches self-link results under the original HTTP URI, so a
          # cache carried over from an older commit could hide a page that
          # is missing from the site built at this SHA.

      - name: Check if site was built
        run: |
          if [ ! -d "_site" ]; then
            echo "Error: _site directory not created"
            exit 1
          fi
          echo "Site built successfully"
          ls -la _site/
        working-directory: docs

      - name: Seed broken relative link
        id: seed_relative
        continue-on-error: true
        uses: lycheeverse/lychee-action@2b973e86fc7b1f6b36a93795fe2c9c6ae1118621  # v1
        with:
          args: >-
            --verbose
            --no-progress
            --config docs/lychee.toml
            --base docs/_lychee_seeds
            --include '^file://${{ github.workspace }}/docs/_lychee_seeds/'
            'docs/_lychee_seeds/broken-relative-link.html'
          fail: true
          output: link-seed-relative.md
          format: markdown

      - name: Seed broken fragment
        id: seed_fragment
        continue-on-error: true
        uses: lycheeverse/lychee-action@2b973e86fc7b1f6b36a93795fe2c9c6ae1118621  # v1
        with:
          args: >-
            --verbose
            --no-progress
            --config docs/lychee.toml
            --base docs/_lychee_seeds
            --include '^file://${{ github.workspace }}/docs/_lychee_seeds/'
            'docs/_lychee_seeds/broken-fragment.html'
          fail: true
          output: link-seed-fragment.md
          format: markdown

      - name: Seed HTTP 403
        id: seed_403
        continue-on-error: true
        uses: lycheeverse/lychee-action@2b973e86fc7b1f6b36a93795fe2c9c6ae1118621  # v1
        with:
          args: >-
            --verbose
            --no-progress
            --config docs/lychee.toml
            'docs/_lychee_seeds/seeded-403.html'
          fail: true
          output: link-seed-403.md
          format: markdown

      - name: Seed HTTP 429
        id: seed_429
        continue-on-error: true
        uses: lycheeverse/lychee-action@2b973e86fc7b1f6b36a93795fe2c9c6ae1118621  # v1
        with:
          args: >-
            --verbose
            --no-progress
            --config docs/lychee.toml
            'docs/_lychee_seeds/seeded-429.html'
          fail: true
          output: link-seed-429.md
          format: markdown

      - name: Assert seeded failures
        if: always()
        env:
          RELATIVE_OUTCOME: ${{ steps.seed_relative.outcome }}
          FRAGMENT_OUTCOME: ${{ steps.seed_fragment.outcome }}
          STATUS_403_OUTCOME: ${{ steps.seed_403.outcome }}
          STATUS_429_OUTCOME: ${{ steps.seed_429.outcome }}
        run: |
          test "$RELATIVE_OUTCOME" = failure
          test "$FRAGMENT_OUTCOME" = failure
          test "$STATUS_403_OUTCOME" = failure
          test "$STATUS_429_OUTCOME" = failure
          grep -Eq '(^|[^0-9])403([^0-9]|$)' link-seed-403.md
          grep -Eq '(^|[^0-9])429([^0-9]|$)' link-seed-429.md

      - name: Link Checker
        uses: lycheeverse/lychee-action@2b973e86fc7b1f6b36a93795fe2c9c6ae1118621  # v1
        with:
          args: >-
            --verbose
            --no-progress
            --config docs/lychee.toml
            --base docs/_site
            --remap 'https://claricle.github.io/sirena/ file://${{ github.workspace }}/docs/_site/'
            --remap 'https://www.claricle.org/sirena/ file://${{ github.workspace }}/docs/_site/'
            --include '^file://${{ github.workspace }}/docs/_site/diagram_types/'
            --include '^file://${{ github.workspace }}/docs/_site/assets/'
            'docs/_site/**/*.html'
          fail: true
          output: link-check-results.md
          format: markdown

      - name: Upload link check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: link-check-results
          path: |
            link-check-results.md
            link-seed-*.md
          retention-days: 30
