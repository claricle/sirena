name: lint

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rubocop:
    # Its own lane, not a step inside the test matrix. Lint answers in
    # under a minute and should not wait on the full Ruby/OS matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073  # v1
        with:
          # The gemspec's declared floor, and the TargetRubyVersion the
          # cops are already configured against. Lint runs once, here.
          ruby-version: '3.2'
          bundler-cache: true
      - run: bundle exec rubocop
