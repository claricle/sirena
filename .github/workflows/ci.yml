# The two required lanes. README.md in this directory says how to add a gate.
#
# Required checks (repository setting, not expressible in YAML): `fast-lane`
# and `full-lane`. Their names never change.
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    tags: [v*]
  workflow_dispatch:
  schedule:
    # Nightly full run on main: belt and braces, not the primary gate.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---- fast lane: unit suite, budget < 10 min ---------------------------
  unit:
    # Everything generic-rake ran before: `bundle exec rake` (spec, benchmark,
    # corpus:check) on the same Ruby x OS matrix.
    name: unit (ruby ${{ matrix.ruby }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ['3.3', '3.4']
        experimental: [false]
        include:
          - {os: ubuntu-latest, ruby: '4.0', experimental: true}
          - {os: macos-latest, ruby: '4.0', experimental: true}
          - {os: windows-latest, ruby: '4.0', experimental: true}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073  # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake

  pins:
    name: pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073  # v1
        with:
          ruby-version: '3.3'
      - run: ruby scripts/check_workflow_pins.rb

  lint:
    # Its own job, not a step inside the unit matrix. Lint answers in under a
    # minute and should not wait on the full Ruby/OS matrix.
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073  # v1
        with:
          # The gemspec's declared floor, and the TargetRubyVersion the
          # cops are already configured against. Lint runs once, here.
          ruby-version: '3.2'
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec rake lint:debt:check

  # Reserved fast-lane slots, one job each, added to `needs` below:
  #   snippet spec (16), scoreboard guard (02b)

  fast-lane:
    name: fast-lane
    if: ${{ always() }}
    needs: [unit, pins, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073  # v1
        with:
          ruby-version: '3.3'
      - run: ruby scripts/lane_verdict.rb
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}

  # ---- full lane: docs and links, budget < 30 min -----------------------
  docs-build:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build_deploy.yml
    with:
      skip_deploy: true

  links:
    uses: ./.github/workflows/links.yml

  corpus:
    # The mermaid corpus ratchet: a case that passed must still pass, and an
    # improvement must be recorded in scoreboard/corpus.json.
    name: corpus
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073  # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec rake corpus:check

  conformance:
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073  # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec rake conformance:check
      - run: bundle exec rspec spec/svg_conformance_spec.rb

  fresh-resolution:
    # Resolves every dependency from scratch, as a user's `gem install` or
    # a new checkout does, so an upstream release that breaks us fails here
    # instead of on someone's machine. No bundler-cache: a cached bundle is
    # the opposite of a fresh resolution.
    name: fresh-resolution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073  # v1
        with:
          ruby-version: '3.3'
      - run: |
          rm -f Gemfile.lock
          bundle install --jobs 4 --retry 3
      - run: bundle exec ruby -e 'require "sirena"; require "svg_conform"'
      - run: bundle exec rspec

  # Still reserved, one job each, added to `needs` below when its gate
  # exists: parity (14), scoreboard guard (02b)

  full-lane:
    name: full-lane
    if: ${{ always() }}
    needs: [docs-build, links, corpus, conformance, fresh-resolution]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073  # v1
        with:
          ruby-version: '3.3'
      - run: ruby scripts/lane_verdict.rb
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}

  # ---- release cascade (not a gate) --------------------------------------
  # generic-rake sent `tests-passed` after a green matrix and, on a v* tag,
  # `do-release` (which release.yml listens for). Kept, without a third-party
  # action. Item 17 owns what happens to it.
  cascade:
    if: ${{ github.event_name == 'push' }}
    needs: [fast-lane]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Dispatch tests-passed
        run: >-
          gh api "repos/${GITHUB_REPOSITORY}/dispatches"
          -f event_type=tests-passed
          -f "client_payload[ref]=${GITHUB_REF}"
          -f "client_payload[sha]=${GITHUB_SHA}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Dispatch do-release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: >-
          gh api "repos/${GITHUB_REPOSITORY}/dispatches"
          -f event_type=do-release
          -f "client_payload[ref]=${GITHUB_REF}"
          -f "client_payload[sha]=${GITHUB_SHA}"
        env:
          GH_TOKEN: ${{ github.token }}
