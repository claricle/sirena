# Temporary unmerged probe for hosted failed/skipped dependency handling.
# Both aggregators execute the unchanged production verdict script.
name: ci

on:
  workflow_dispatch:
    inputs:
      seed_outcome:
        description: Result to seed for the required child
        type: choice
        required: true
        default: failure
        options:
          - failure
          - skipped

permissions:
  contents: read

concurrency:
  group: lane-seed-${{ github.ref }}-${{ inputs.seed_outcome }}
  cancel-in-progress: false

jobs:
  seeded-child:
    name: seeded-child
    if: ${{ inputs.seed_outcome == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: fail the required child
        run: exit 1
        shell: bash

  fast-lane:
    name: fast-lane
    if: ${{ always() }}
    needs: [seeded-child]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073  # v1
        with:
          ruby-version: '3.3'
      - run: ruby scripts/lane_verdict.rb
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}

  full-lane:
    name: full-lane
    if: ${{ always() }}
    needs: [seeded-child]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073  # v1
        with:
          ruby-version: '3.3'
      - run: ruby scripts/lane_verdict.rb
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
