# Detached from Cimas: this tracked file is authoritative. No Cimas
# configuration is tracked in this repo, so nothing regenerates it; edit it
# here. Bump procedure for the pinned reusable workflow: see README.md.
name: release

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version. Possible values: x.y.z, major, minor, patch or pre|rc|etc
        required: true
        default: "skip"
  repository_dispatch:
    types: [do-release]

jobs:
  release:
    uses: metanorma/ci/.github/workflows/rubygems-release.yml@875ae77e781264728ec8447c11b23d3335b68d6d  # main
    with:
      next_version: ${{ github.event.inputs.next_version }}
    secrets:
      rubygems-api-key: ${{ secrets.CLARICLE_CI_RUBYGEMS_API_KEY }}
      pat_token: ${{ secrets.GITHUB_TOKEN }}
