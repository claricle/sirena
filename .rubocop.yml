inherit_from:
  # Pinned to a SHA, not `main`. Bump it deliberately, in its own PR, so an
  # upstream edit cannot turn this lane red on its own.
  - https://raw.githubusercontent.com/riboseinc/oss-guides/03e81f3124ceab971146671d140e410e0e915c06/ci/rubocop.yml
  - .rubocop_todo.yml

plugins:
- rubocop-performance
- rubocop-rake
- rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - 'vendor/**/*'

# The separator arguments this cop calls redundant are only redundant when
# `$/` and `$,` are untouched. A library cannot assume that: with `$/` set
# to nil a parse error reports the wrong line and loses the source it was
# quoting, and with `$,` set the message itself is corrupted.
Style/RedundantArgument:
  Enabled: false
