inherit_from:
  # Pinned to a SHA, not `main`. Bump it deliberately, in its own PR, so an
  # upstream edit cannot turn this lane red on its own.
  - https://raw.githubusercontent.com/riboseinc/oss-guides/03e81f3124ceab971146671d140e410e0e915c06/ci/rubocop.yml
  - .rubocop_todo.yml

plugins:
- rubocop-performance
- rubocop-rake
- rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - 'vendor/**/*'

# The benchmark files are deliberately not named `_spec.rb`: that is what
# keeps them out of `rspec`'s default pattern, so a normal run carries no
# clock reading and no fixture with thousands of boxes in it. `rake
# benchmark` runs them by their own pattern.
RSpec/SpecFilePathSuffix:
  Exclude:
    - 'spec/benchmarks/**/*'
